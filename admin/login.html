<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin | SD Negeri Muarasari 1</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card">
      <div class="brand-mark">SDN</div>
      <span class="badge">Portal Pengelola Sekolah</span>
      <h1>Selamat Datang</h1>
      <p>Masuk ke panel admin untuk mengelola konten website SD Negeri Muarasari 1.</p>
      <form>
        <div class="field"><label for="user">Username</label><input id="user" type="text" placeholder="Masukkan username"></div>
        <div class="field"><label for="pass">Password</label><input id="pass" type="password" placeholder="Masukkan password"></div>
        <button class="btn btn--primary" type="submit">Masuk Dashboard</button>
      </form>
      <small>© SD Negeri Muarasari 1</small>
    </section>
  </main>
  <script src="../assets/js/app.js"></script>
</body>
</html>
