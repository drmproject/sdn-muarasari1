<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin | SD Negeri Muarasari 1</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card">
      <span class="badge">Portal Admin</span>
      <h1>Login Admin</h1>
      <p>Masuk untuk mengelola berita, pengumuman, galeri, dan data sekolah.</p>
      <form>
        <div class="field"><label for="user">Username</label><input id="user" type="text" placeholder="Username"></div>
        <div class="field"><label for="pass">Password</label><input id="pass" type="password" placeholder="Password"></div>
        <button class="btn btn--primary" type="submit">Masuk</button>
      </form>
    </section>
  </main>
  <script src="../assets/js/app.js"></script>
</body>
</html>
