<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | SD Negeri Muarasari 1</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="admin-dashboard">
    <div class="section-title"><span>Admin Panel</span><h1>Dashboard</h1><p>Ringkasan kontrol untuk website sekolah.</p></div>
    <div class="dashboard-grid">
      <aside class="sidebar">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Berita</a>
        <a href="#">Pengumuman</a>
        <a href="#">Guru</a>
        <a href="#">Galeri</a>
        <a href="#">Agenda</a>
        <a href="#">PPDB</a>
        <a href="#">Download</a>
      </aside>
      <section class="dashboard-main">
        <div class="kpi-grid">
          <div class="kpi"><strong>12</strong><span>Berita</span></div>
          <div class="kpi"><strong>8</strong><span>Pengumuman</span></div>
          <div class="kpi"><strong>24</strong><span>Galeri</span></div>
          <div class="kpi"><strong>16</strong><span>Dokumen</span></div>
        </div>
        <div class="card">
          <h3>Aktivitas Terbaru</h3>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Waktu</th><th>Aktivitas</th><th>Status</th></tr></thead>
              <tbody>
                <tr><td>Hari ini</td><td>Tambah berita</td><td>Selesai</td></tr>
                <tr><td>Hari ini</td><td>Update pengumuman</td><td>Selesai</td></tr>
                <tr><td>Kemarin</td><td>Upload galeri</td><td>Selesai</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="../assets/js/app.js"></script>
</body>
</html>
